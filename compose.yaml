name: simple-api

services:
  server:
    image: simple-api:latest
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      NEW_RELIC_APP_NAME: "${NEW_RELIC_APP_NAME} | Server"
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
    ports:
      - "8000:8000"
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  client:
    image: simple-api:latest
    network_mode: service:server
    depends_on:
      server:
        condition: service_healthy
    environment:
      NEW_RELIC_APP_NAME: "${NEW_RELIC_APP_NAME} | Client"
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
    command:
      - uvicorn
      - apps.client.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    restart: unless-stopped
